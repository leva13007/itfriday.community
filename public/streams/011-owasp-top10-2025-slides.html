<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWASP Top 10:2025 — Доповідь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --bg-2:#0d1117;
    --panel:#131820;
    --panel-2:#171e28;
    --border:#242c38;
    --text:#eceff3;
    --text-dim:#8891a0;
    --text-faint:#5b6472;
    --amber:#e8a33d;
    --amber-dim:#8a662a;
    --red:#e5484d;
    --red-dim:#6e2b2d;
    --teal:#49c7b8;
    --teal-dim:#296059;
    --display:'Space Grotesk',sans-serif;
    --body:'IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    overflow:hidden;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 8%, rgba(232,163,61,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(73,199,184,0.05), transparent 40%);
  }
  ::selection{ background:var(--amber); color:#0a0d12; }

  /* ---------- deck shell ---------- */
  #deck{
    position:relative;
    width:100vw;
    height:100vh;
  }
  .slide{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    padding:5.2vh 6.5vw 8vh 6.5vw;
    opacity:0;
    visibility:hidden;
    transform:translateX(24px);
    transition:opacity .45s ease, transform .45s ease;
    pointer-events:none;
  }
  .slide.active{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    pointer-events:auto;
  }
  .slide.prev{ transform:translateX(-24px); }

  .eyebrow{
    font-family:var(--mono);
    font-size:.92rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:.6em;
    margin-bottom:1.3rem;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:var(--amber);
    display:inline-block;
  }
  h1.slide-title{
    font-family:var(--display);
    font-weight:600;
    font-size:3.3rem;
    line-height:1.08;
    letter-spacing:-.01em;
    max-width:20ch;
  }
  .slide-sub{
    font-size:1.3rem;
    color:var(--text-dim);
    max-width:66ch;
    margin-top:1.1rem;
    line-height:1.55;
  }

  /* ---------- TITLE SLIDE ---------- */
  .s-title{ justify-content:center; align-items:flex-start; }
  .s-title .kicker{
    font-family:var(--mono);
    font-size:1rem;
    color:var(--text-faint);
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:2.4rem;
  }
  .terminal-title{
    font-family:var(--mono);
    font-weight:600;
    font-size:clamp(3.2rem, 7.4vw, 6.8rem);
    line-height:1.02;
    letter-spacing:-.01em;
    color:var(--text);
  }
  .terminal-title .accent{ color:var(--amber); }
  .cursor{
    display:inline-block;
    width:.52em; height:.85em;
    background:var(--amber);
    margin-left:.15em;
    animation:blink 1.1s steps(1) infinite;
    transform:translateY(.08em);
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .title-desc{
    font-size:1.5rem;
    color:var(--text-dim);
    max-width:48ch;
    margin-top:1.8rem;
    line-height:1.6;
  }
  .title-meta{
    margin-top:3.4rem;
    display:flex;
    gap:2.6rem;
    font-family:var(--mono);
    font-size:1rem;
    color:var(--text-faint);
  }
  .title-meta b{ color:var(--teal); font-weight:600; }
  .scanline{
    position:absolute; inset:0;
    pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(232,163,61,0.035) 50%, transparent 100%);
    background-size:100% 6px;
    opacity:.5;
    mix-blend-mode:overlay;
  }

  /* ---------- generic content blocks ---------- */
  .content-body{ flex:1; display:flex; flex-direction:column; justify-content:center; margin-top:1.4rem; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:3.2rem; align-items:start; }
  .three-col{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.6rem; }

  ul.bullet-list{ list-style:none; display:flex; flex-direction:column; gap:1.05rem; }
  ul.bullet-list li{
    position:relative;
    padding-left:1.4rem;
    font-size:1.18rem;
    line-height:1.5;
    color:var(--text);
  }
  ul.bullet-list li::before{
    content:'';
    position:absolute; left:0; top:.6em;
    width:7px; height:7px;
    background:var(--amber);
    border-radius:1px;
  }
  ul.bullet-list.teal li::before{ background:var(--teal); }
  ul.bullet-list.red li::before{ background:var(--red); }

  .block-label{
    font-family:var(--mono);
    font-size:.88rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:1.1rem;
    display:flex; align-items:center; gap:.5rem;
  }
  .block-label.amber{ color:var(--amber); }
  .block-label.teal{ color:var(--teal); }
  .block-label.red{ color:var(--red); }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1.5rem 1.7rem;
  }

  /* ---------- INTRO / GENERIC STAT slides ---------- */
  .stat-row{ display:flex; gap:1.2rem; margin-top:1.6rem; }
  .stat-card{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:1.4rem 1.5rem;
  }
  .stat-card .num{
    font-family:var(--mono);
    font-size:2.7rem;
    font-weight:600;
    color:var(--amber);
    line-height:1;
  }
  .stat-card .lbl{
    font-size:1.02rem;
    color:var(--text-dim);
    margin-top:.7rem;
    line-height:1.4;
  }

  /* ---------- OVERVIEW LIST (leaderboard) ---------- */
  .ov-legend{
    display:grid;
    grid-template-columns:100px 130px 1fr 340px 100px;
    gap:1.6rem;
    padding:0 1.5rem;
    margin-top:1.6rem;
    margin-bottom:.6rem;
  }
  .ov-legend span{
    font-family:var(--mono);
    font-size:.76rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .ov-legend span.right{ text-align:right; }
  .ov-list{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    min-height:0;
  }
  .ov-row{
    display:grid;
    grid-template-columns:100px 130px 1fr 340px 100px;
    align-items:center;
    gap:1.6rem;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:.95rem 1.5rem;
    transition:border-color .2s ease, transform .2s ease;
  }
  .ov-row:hover{ border-color:var(--amber-dim); transform:translateX(5px); }
  .ov-code{ font-family:var(--mono); font-weight:700; font-size:1.5rem; color:var(--amber); }
  .ov-trend{
    font-family:var(--mono); font-size:.85rem; font-weight:600;
    padding:.28rem .65rem; border-radius:20px; letter-spacing:.03em;
    justify-self:start; white-space:nowrap;
  }
  .ov-trend.up{ color:var(--teal); background:rgba(73,199,184,.12); }
  .ov-trend.down{ color:var(--text-faint); background:rgba(255,255,255,.05); }
  .ov-trend.same{ color:var(--amber); background:rgba(232,163,61,.12); }
  .ov-trend.new{ color:var(--red); background:rgba(229,72,77,.14); }
  .ov-name{ font-size:1.22rem; font-weight:500; line-height:1.25; }
  .ov-bar-wrap{ display:flex; align-items:center; }
  .ov-bar{
    width:100%; height:9px;
    background:var(--panel-2);
    border-radius:5px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .ov-bar-fill{ height:100%; border-radius:5px; background:var(--amber); }
  .ov-pct{
    font-family:var(--mono); font-size:1.05rem; font-weight:600;
    color:var(--text-dim); text-align:right;
  }

  /* ---------- CHANGE slide ---------- */
  .change-list{ display:flex; flex-direction:column; gap:1.1rem; margin-top:1.6rem; }
  .change-item{
    display:grid;
    grid-template-columns:130px 1fr;
    gap:1.4rem;
    align-items:baseline;
    border-bottom:1px solid var(--border);
    padding-bottom:1.1rem;
  }
  .change-tag{
    font-family:var(--mono);
    font-size:.92rem;
    font-weight:600;
    padding:.32rem .6rem;
    border-radius:4px;
    text-align:center;
    letter-spacing:.05em;
  }
  .change-tag.new{ background:rgba(229,72,77,.14); color:var(--red); }
  .change-tag.merge{ background:rgba(232,163,61,.14); color:var(--amber); }
  .change-tag.rename{ background:rgba(73,199,184,.14); color:var(--teal); }
  .change-text b{ color:var(--text); }
  .change-text{ color:var(--text-dim); font-size:1.18rem; line-height:1.5; }

  /* ---------- CATEGORY SLIDE ---------- */
  .cat-slide{ padding-top:3.6vh; }
  .cat-head{ display:flex; align-items:flex-end; gap:1.8rem; justify-content:space-between; }
  .cat-code{
    font-family:var(--mono);
    font-weight:700;
    font-size:6.6rem;
    line-height:.88;
    color:var(--amber);
    letter-spacing:-.02em;
  }
  .cat-headtext{ flex:1; padding-bottom:.5rem; }
  .cat-title{ font-family:var(--display); font-weight:600; font-size:2.75rem; line-height:1.15; }
  .cat-rank{
    font-family:var(--mono);
    font-size:1.1rem;
    color:var(--text-dim);
    margin-top:.8rem;
    display:flex; align-items:center; gap:.6rem;
  }
  .rank-pill{
    font-size:.95rem;
    padding:.22rem .65rem;
    border-radius:20px;
    font-weight:600;
  }
  .rank-pill.up{ background:rgba(73,199,184,.14); color:var(--teal); }
  .rank-pill.down{ background:rgba(255,255,255,.05); color:var(--text-faint); }
  .rank-pill.same{ background:rgba(232,163,61,.14); color:var(--amber); }
  .rank-pill.new{ background:rgba(229,72,77,.14); color:var(--red); }

  .gauges{ display:flex; gap:2.8rem; padding-bottom:.5rem; }
  .gauge{ width:200px; }
  .gauge-top{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:.95rem; color:var(--text-faint); margin-bottom:.5rem; text-transform:uppercase; letter-spacing:.04em;}
  .gauge-val{ color:var(--text); font-weight:600; }
  .gauge-bar{ height:7px; background:var(--panel-2); border-radius:4px; overflow:hidden; border:1px solid var(--border); }
  .gauge-fill{ height:100%; border-radius:3px; }
  .gauge-fill.inc{ background:var(--amber); }
  .gauge-fill.exp{ background:var(--red); }
  .gauge-fill.imp{ background:var(--teal); }

  .cat-body{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:3.4rem;
    margin-top:3rem;
    min-height:0;
  }
  .cat-col{ display:flex; flex-direction:column; justify-content:center; gap:2.4rem; min-height:0; }
  .cat-col .block-label{ font-size:.95rem; margin-bottom:.2rem; }
  .cat-col ul.bullet-list{ gap:1.4rem; }
  .cat-col ul.bullet-list li{ font-size:1.38rem; line-height:1.5; padding-left:1.6rem; }
  .cat-col ul.bullet-list li::before{ width:8px; height:8px; top:.62em; }
  .example-box{
    background:var(--panel-2);
    border-left:3px solid var(--amber);
    border-radius:0 6px 6px 0;
    padding:1.6rem 1.9rem;
    font-family:var(--mono);
    font-size:1.12rem;
    line-height:1.6;
    color:var(--text-dim);
  }
  .cwe-row{ display:flex; flex-wrap:wrap; gap:.65rem; margin-top:.3rem; }
  .cwe-chip{
    font-family:var(--mono);
    font-size:.95rem;
    color:var(--text-faint);
    border:1px solid var(--border);
    padding:.34rem .8rem;
    border-radius:20px;
  }

  /* ---------- CODE / ANTI-PATTERN SLIDE ---------- */
  .code-body{
    flex:1;
    display:grid;
    grid-template-columns:1.35fr 1fr;
    gap:3rem;
    margin-top:2.6rem;
    min-height:0;
    align-items:center;
  }
  .code-panel{
    background:var(--panel);
    border:1px solid var(--red-dim);
    border-radius:10px;
    overflow:hidden;
  }
  .code-panel-label{
    font-family:var(--mono);
    font-size:.85rem;
    font-weight:600;
    letter-spacing:.1em;
    color:var(--red);
    background:rgba(229,72,77,.1);
    border-bottom:1px solid var(--red-dim);
    padding:.7rem 1.4rem;
  }
  .code-block{
    font-family:var(--mono);
    font-size:1.18rem;
    line-height:1.75;
    color:var(--text);
    padding:1.6rem 1.7rem;
    white-space:pre;
    overflow-x:auto;
  }
  .code-why{ display:flex; flex-direction:column; gap:1.4rem; justify-content:center; }
  .code-why ul.bullet-list li{ font-size:1.28rem; line-height:1.5; }

  /* ---------- JWT COMPARISON SLIDE ---------- */
  .jwt-body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.8rem; min-height:0; }
  .jwt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1.8rem; }
  .jwt-card{ border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--panel); }
  .jwt-card.good{ border-color:var(--teal-dim); }
  .jwt-card.evil{ border-color:var(--red-dim); }
  .jwt-card-label{ font-family:var(--mono); font-size:.82rem; font-weight:600; letter-spacing:.08em; padding:.65rem 1.2rem; }
  .jwt-card.good .jwt-card-label{ color:var(--teal); background:rgba(73,199,184,.1); border-bottom:1px solid var(--teal-dim); }
  .jwt-card.evil .jwt-card-label{ color:var(--red); background:rgba(229,72,77,.1); border-bottom:1px solid var(--red-dim); }
  .jwt-token{ font-family:var(--mono); font-size:.74rem; line-height:1.6; padding:.9rem 1.2rem; word-break:break-all; border-bottom:1px solid var(--border); }
  .jwt-token .seg-h{ color:var(--amber); }
  .jwt-token .seg-p{ color:var(--teal); }
  .jwt-token .seg-s{ color:var(--text-faint); }
  .jwt-token .seg-dot{ color:var(--text-faint); }
  .jwt-decoded{ padding:1rem 1.2rem; font-family:var(--mono); font-size:.98rem; line-height:1.65; color:var(--text-dim); }
  .jwt-decoded .jwt-line-2{ margin-top:.6rem; }
  .jwt-explain{ display:grid; grid-template-columns:1fr 1fr; gap:2.6rem; }
  .jwt-explain ul.bullet-list li{ font-size:1.05rem; line-height:1.5; }

  /* ---------- METHOD slide ---------- */
  .method-grid{ display:grid; grid-template-columns:1.1fr .9fr; gap:2.6rem; margin-top:1.6rem; align-items:start; }
  .donor-wrap{ display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.8rem; }
  .donor-chip{
    font-family:var(--mono); font-size:.88rem; color:var(--text-dim);
    border:1px solid var(--border); padding:.36rem .7rem; border-radius:4px;
  }
  .authors-list{ display:flex; flex-direction:column; gap:.6rem; margin-top:.9rem; }
  .authors-list li{ font-size:1.05rem; color:var(--text-dim); list-style:none; }
  .authors-list li b{ color:var(--text); font-weight:500; }

  /* ---------- NEXT STEPS slide ---------- */
  .steps-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1.3rem; margin-top:1.8rem; }
  .step-card{ background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1.3rem 1.4rem; }
  .step-card .step-idx{ font-family:var(--mono); color:var(--teal); font-size:.92rem; margin-bottom:.6rem; }
  .step-card h3{ font-family:var(--display); font-size:1.3rem; font-weight:600; margin-bottom:.6rem; }
  .step-card p{ font-size:1.04rem; color:var(--text-dim); line-height:1.5; }
  .source-line{
    margin-top:2.2rem;
    font-family:var(--mono);
    font-size:1rem;
    color:var(--text-faint);
  }
  .source-line a{ color:var(--teal); text-decoration:none; }
  .source-line a:hover{ text-decoration:underline; }

  /* ---------- NAV UI ---------- */
  #progress{
    position:fixed; top:0; left:0; height:2px;
    background:linear-gradient(90deg, var(--amber), var(--teal));
    z-index:50;
    transition:width .35s ease;
  }
  #nav-ui{
    position:fixed; bottom:0; left:0; right:0;
    height:6.5vh;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2.4vw;
    z-index:50;
    background:linear-gradient(0deg, rgba(10,13,18,.92), transparent);
  }
  #counter{
    font-family:var(--mono); font-size:.95rem; color:var(--text-faint);
    letter-spacing:.05em;
  }
  #counter b{ color:var(--text); }
  .nav-controls{ display:flex; align-items:center; gap:.6rem; }
  .nav-btn{
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .nav-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .nav-btn svg{ width:16px; height:16px; }
  #fs-btn{ margin-left:1rem; }
  #fs-btn.on{ color:var(--teal); border-color:var(--teal-dim); }

  .slide-name{
    font-family:var(--mono); font-size:.9rem; color:var(--text-faint);
    letter-spacing:.06em;
  }

  @media (max-width:1000px){
    .ov-row, .ov-legend{ grid-template-columns:70px 100px 1fr; }
    .ov-bar-wrap, .ov-pct, .ov-legend span:nth-child(4), .ov-legend span:nth-child(5){ display:none; }
    .two-col, .cat-body, .method-grid, .steps-grid{ grid-template-columns:1fr; }
    .gauges{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

<div id="progress" style="width:0%"></div>
<div id="deck"></div>

<div id="nav-ui">
  <div id="counter"><b id="cur">01</b> / <span id="total">00</span> &nbsp;·&nbsp; <span class="slide-name" id="slide-name"></span></div>
  <div class="nav-controls">
    <button class="nav-btn" id="prev-btn" title="Попередній (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="next-btn" title="Наступний (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nav-btn" id="fs-btn" title="На весь екран (F)">
      <svg id="fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>
</div>

<script>
/* =========================================================
   DATA — OWASP Top 10:2025 (owasp.org/Top10/2025)
   ========================================================= */
const CATS = [
  {
    code:'A01', name:'Порушення контролю доступу', en:'Broken Access Control',
    rank:'#1', trend:'same', trendLabel:'Утримує 1-ше місце',
    inc:3.74, exp:7.04, imp:3.84,
    issues:[
      'Порушення принципу «заборонено за замовчуванням» — доступ дозволено там, де мав бути обмежений',
      'IDOR: підміна ідентифікатора запису в URL чи API відкриває доступ до чужих даних',
      'Відсутній контроль доступу на рівні POST/PUT/DELETE у API',
      'Підробка JWT/cookie, CORS-помилки, «force browsing» до адмін-сторінок'
    ],
    prevention:[
      'Заборона за замовчуванням, окрім явно публічних ресурсів',
      'Єдиний, перевикористовуваний серверний механізм контролю доступу',
      'Модель доступу прив’язана до власника запису, а не до довільного ID',
      'Логування відмов доступу, rate limiting, короткоживучі токени'

            <li>Безпека — не плагін і не крок у CI/CD, який просто «додають» — сканер знайде відому вразливість у бібліотеці, але не побачить, що ти забув перевірити власника запису в новому ендпоінті</li>
            <li>Виправити вразливість на етапі вимог чи дизайну завжди в рази дешевше, ніж ту саму вразливість, знайдену вже в продакшн</li>
            <li>AppSec-команда фізично не може вручну перевірити кожен рядок коду — на десятки й сотні розробників часто припадає лише кілька фахівців з безпеки</li>

function jwtColored(token){
  const parts = token.split('.');
  const classes = ['seg-h','seg-p','seg-s'];
  return parts.map((p,i)=>`<span class="${classes[i]}">${p}</span>`).join('<span class="seg-dot">.</span>');
}

          <li>Один ендпоінт замість багатьох URL — REST перевіряє права per-маршрут, а в GraphQL усі запити йдуть через <span style="font-family:var(--mono);">/graphql</span>, тож авторизацію треба явно реалізувати в кожному resolver’і окремо</li>
          <li>Вкладені зв’язки в графі не успадковують перевірку з кореня: <span style="font-family:var(--mono); font-size:.92em;">user → orders → payment</span> може пропустити authorization на будь-якому рівні вкладеності</li>
          <li>Introspection увімкнено в продакшені — уся схема (типи, поля, «приховані» адмін-мутації) видима будь-кому без розвідки</li>
          <li>Aliasing/batching: десятки IDOR-спроб пакуються в один HTTP-запит і обходять rate-limit, розрахований на кількість запитів, а не полів усередині</li>
        </ul>
      </div>
      <div class="cat-col">
        <div class="block-label teal">Як захищатись</div>
        <ul class="bullet-list teal">
          <li>Авторизація на рівні кожного resolver’а (field-level authorization), а не лише вхідної точки запиту</li>
          <li>Вимкнути introspection і GraphiQL/Playground у продакшн-середовищі</li>
          <li>Обмеження глибини запиту (depth limiting) і аналіз «вартості» запиту (query cost analysis)</li>
          <li>Rate-limiting за вартістю запиту з урахуванням aliases, а не за кількістю HTTP-викликів</li>
        </ul>
        <div class="example-box">query { a: user(id:1){email} b: user(id:2){email} c: user(id:3){email} … } — десятки IDOR-спроб в одному HTTP-запиті обходять rate-limit, який рахує кількість запитів, а не полів усередині.</div>
        <div class="cwe-row">
          <span class="cwe-chip">Field-level Authorization</span>
          <span class="cwe-chip">Introspection Exposure</span>
          <span class="cwe-chip">Query Batching Abuse</span>
        </div>
      </div>
    </div>
  </section>`;
}

  <section class="slide" data-name="Методологія">

/* =========================================================
   BUILD DECK
   ========================================================= */
const catSlides = [];
CATS.forEach((c, i) => {
  catSlides.push(slideCategory(c, i));
  catSlides.push(slideBadExample(c));
  if (c.code === 'A01') { catSlides.push(slideJWTAttack()); catSlides.push(slideGraphQL()); }
});

const slidesHTML = [
  slideWhyItMatters(),
  slideTitle(),
  slideOWASP(),
  slideIntro(),
  slideOverview(),
  ...catSlides,
  slideNext()
];

const deck = document.getElementById('deck');
deck.innerHTML = slidesHTML.join('\n');
const slides = Array.from(document.querySelectorAll('.slide'));
document.getElementById('total').textContent = String(slides.length).padStart(2,'0');

let current = 0;

function render(){
  slides.forEach((s, i)=>{
    s.classList.remove('active','prev');
    if(i === current) s.classList.add('active');
    else if(i < current) s.classList.add('prev');
  });
  document.getElementById('cur').textContent = String(current+1).padStart(2,'0');
  document.getElementById('slide-name').textContent = slides[current].dataset.name || '';
  document.getElementById('progress').style.width = ((current+1)/slides.length*100) + '%';
  document.getElementById('prev-btn').style.opacity = current===0 ? .35 : 1;
  document.getElementById('next-btn').style.opacity = current===slides.length-1 ? .35 : 1;
}

function goTo(i){
  current = Math.max(0, Math.min(slides.length-1, i));
  render();
}
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

document.getElementById('next-btn').addEventListener('click', next);
document.getElementById('prev-btn').addEventListener('click', prev);

window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key === 'Home'){ e.preventDefault(); goTo(0); }
  else if(e.key === 'End'){ e.preventDefault(); goTo(slides.length-1); }
  else if(e.key.toLowerCase() === 'f'){ e.preventDefault(); toggleFullscreen(); }
});

/* swipe / wheel navigation for desktop trackpads */
let wheelLock = false;
window.addEventListener('wheel', (e)=>{
  if(wheelLock) return;
  if(Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  if(e.deltaY > 0) next(); else prev();
  setTimeout(()=>{ wheelLock = false; }, 550);
}, {passive:true});

/* ---------- fullscreen ---------- */
const fsBtn = document.getElementById('fs-btn');
const fsIcon = document.getElementById('fs-icon');
const ICON_EXPAND = `<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>`;
const ICON_COMPRESS = `<path d="M9 3v3a2 2 0 0 1-2 2H4M20 8h-3a2 2 0 0 1-2-2V3M4 16h3a2 2 0 0 1 2 2v3M15 21v-3a2 2 0 0 1 2-2h3"/>`;

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', ()=>{
  const on = !!document.fullscreenElement;
  fsBtn.classList.toggle('on', on);
  fsIcon.innerHTML = on ? ICON_COMPRESS : ICON_EXPAND;
  fsBtn.title = on ? 'Вийти з повноекранного режиму (F)' : 'На весь екран (F)';
});

render();
</script>
</body>
</html>
